services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: estimator_migrator
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: estimator
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?Set APP_DB_PASSWORD}
    ports: ["127.0.0.1:5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data, ./database/init:/docker-entrypoint-initdb.d:ro]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U estimator_migrator -d estimator"]
      interval: 5s
      timeout: 5s
      retries: 12
  redis:
    image: redis:7-alpine
    ports: ["127.0.0.1:6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10
  migrate:
    build: ./backend
    command: sh -c 'cd /srv && alembic upgrade head'
    environment:
      DATABASE_URL: postgresql+psycopg://estimator_migrator:${POSTGRES_PASSWORD}@db:5432/estimator
      REDIS_URL: redis://redis:6379/0
      COOKIE_SECURE: "false"
    depends_on:
      db: {condition: service_healthy}
    profiles: [tools]
  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://estimator_app:${APP_DB_PASSWORD:?Set APP_DB_PASSWORD}@db:5432/estimator
      REDIS_URL: redis://redis:6379/0
      COOKIE_SECURE: "false"
      APP_ENV: development
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
  worker:
    build: ./backend
    command: python -m rq worker --url redis://redis:6379/0 default
    environment:
      DATABASE_URL: postgresql+psycopg://estimator_app:${APP_DB_PASSWORD:?Set APP_DB_PASSWORD}@db:5432/estimator
      REDIS_URL: redis://redis:6379/0
    depends_on:
      redis: {condition: service_healthy}
  frontend:
    build: ./frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports: ["127.0.0.1:3000:3000"]
    depends_on: [api]
volumes:
  pgdata:
